[project]
name = "marine"
version = "0.1.0"
description = "Sagar Setu — conversational marine decision support for Indian small-craft fishermen"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "shapely>=2.0",
    "numpy>=1.26",
    "xarray>=2024.6",
    "netCDF4>=1.6",
    "python-dotenv>=1.0",
    "truststore>=0.9",
    "copernicusmarine>=2.4",
    "langgraph>=0.2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "openpyxl>=3.1",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/marine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E501"]  # printing scripts: long f-strings are the point
"src/marine/agents/*" = ["E501"]  # prompts and brief lines are prose
